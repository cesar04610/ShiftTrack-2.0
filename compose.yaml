services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: shifttrack
      POSTGRES_PASSWORD: shifttrack_local_only
      POSTGRES_DB: shifttrack
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["shifttrack-db:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shifttrack -d shifttrack"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  shifttrack-db:
